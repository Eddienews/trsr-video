<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRSR Video</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("trsr-theme")==="light"?"light":"dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Dark is the default: this is a video studio, and the picture should be the brightest thing on screen. */
:root{
  --bg:#12101E; --panel:#1B182D; --panel2:#262241; --field:#110F1C; --line:#353058;
  --text:#ECE9F7; --muted:#9E99C0; --accent:#F4A63A; --accent-deep:#FFBD5C; --on-accent:#1E1B3A;
  --lilac:#B9B0EE; --dusk:#9186EA; --teal:#3FBFA8; --ok:#63D6B5; --warn:#FF8F85;
  --alert-bg:#3B1F2C; --soft-bg:#3A2D19; --code:#0C0A16; --code-text:#E9E6F7; --stage:#000;
  --ui:"Bricolage Grotesque",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#E6E2F1; --panel:#FBFAFE; --panel2:#EFEBF8; --field:#fff; --line:#CFC9E3;
  --text:#1E1B3A; --muted:#625E80; --accent:#F4A63A; --accent-deep:#C97A0E; --on-accent:#1E1B3A;
  --lilac:#B9B0EE; --dusk:#5B4FB3; --teal:#17847F; --ok:#17847F; --warn:#B3261E;
  --alert-bg:#FBECEA; --soft-bg:#FDF3E1; --code:#120F27; --code-text:#E9E6F7; --stage:#0B0A12;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid var(--panel)}

/* ---------- app bar ---------- */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none;width:34px;height:34px}
.wm{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.wm span{font-weight:400;color:var(--muted)}
.ver{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:5px;padding:2px 7px;white-space:nowrap}
.by{font-size:.8rem;color:var(--muted);white-space:nowrap;border-left:1px solid var(--line);padding-left:10px}
.appbar-right{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 9px;font-weight:600;cursor:pointer;font-size:.8rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.sun,.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sun:hover,.btn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.warnb{background:var(--warn);border-color:var(--warn);color:#2A0B08}
.btn.big{font-size:1.05rem;padding:10px 22px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[hidden]{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- workspace: bins on the left, monitor in the middle, output on the right ---------- */
.workspace{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr) minmax(340px,430px);min-height:0}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.panel.left{border-right:1px solid var(--line)}
.panel.right{border-left:1px solid var(--line)}
.ptabs{display:flex;gap:2px;padding:6px 6px 0;background:var(--bg);overflow-x:auto;flex:none}
.ptabs button{border:0;background:transparent;color:var(--muted);padding:8px 10px;font-weight:600;font-size:.84rem;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
.ptabs button:hover{color:var(--text)}
.ptabs button.on{background:var(--panel);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.ptabs button[hidden]{display:none}
.ptabs .score{font-family:var(--mono);font-size:.72rem;margin-left:5px;color:var(--accent)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 18px}
.step,.pane{display:none}
.step.on,.pane.on{display:block}
.pane.on.col{display:flex;flex-direction:column;min-height:0;height:100%}
.hint{margin:0 0 10px;color:var(--muted);font-size:.86rem}

/* ---------- form ---------- */
label{display:block;font-weight:600;font-size:.84rem;margin:11px 0 4px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{resize:vertical;min-height:70px;line-height:1.4}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
::placeholder{color:var(--muted);opacity:.7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:78px 1fr;gap:10px}
.row3>div:nth-child(3){grid-column:1/-1}
.item{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:2px 11px 11px;margin-top:10px;background:var(--panel2)}
.item.char{border-left-color:var(--teal)}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.item-head strong{font-family:var(--mono);font-size:.82rem}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.who label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;background:var(--field)}
.who input{width:auto;margin:0;accent-color:var(--teal)}
.who label:has(input:checked){border-color:var(--teal);color:var(--ok)}
.who .none{font-size:.8rem;color:var(--muted)}
.miss{outline:2px solid var(--warn);outline-offset:3px;border-radius:7px}

/* ---------- monitor ---------- */
.center{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.monitor{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px 18px 8px;container-type:size}
.stage{position:relative;background:var(--stage);aspect-ratio:16/9;width:min(100cqw,calc(100cqh*var(--arn,1.7778)));border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line)}
.stage video{width:100%;height:100%;object-fit:contain;background:#000}
.stage-msg{text-align:center;color:#B9B4D8;padding:16px;max-width:36ch}
.stage-msg b{display:block;font-size:1.15rem;color:#fff;margin-bottom:4px}
.stage-msg .tc{font-family:var(--mono);font-size:1.6rem;color:var(--accent);display:block;margin:6px 0}
.stage::before,.stage::after{content:"";position:absolute;width:22px;height:22px;border:2px solid rgba(255,255,255,.28);pointer-events:none}
.stage::before{left:10px;top:10px;border-right:0;border-bottom:0}
.stage::after{right:10px;bottom:10px;border-left:0;border-top:0}
.stage:has(video)::before,.stage:has(video)::after{display:none}
.bar2{height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:10px}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 18px 14px;flex:none}
.transport{align-items:flex-end}
.transport .meta{font-family:var(--mono);font-size:.78rem;color:var(--muted);min-width:0;flex-basis:100%}
.pick{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;min-width:0}
.pick[hidden]{display:none}
.pick label{margin:0 0 3px;font-size:.74rem;color:var(--muted)}
.pick select{width:auto;min-width:118px;max-width:220px;padding:8px 9px;background:var(--panel2)}
.pick .est{font-family:var(--mono);font-size:1.1rem;font-weight:600;color:var(--accent);padding:0 4px 8px;white-space:nowrap}
.pick .pnote{flex-basis:100%;font-size:.84rem;color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pick .pnote .btn{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.transport .meta b{color:var(--text);font-weight:600}

/* ---------- output panel ---------- */
.seg{display:flex;gap:3px;margin:0 0 8px;background:var(--field);border-radius:8px;padding:3px;flex:none}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:6px 8px;font-weight:600;cursor:pointer;font-size:.82rem}
.seg button[aria-selected="true"]{background:var(--panel2);color:var(--text)}
.tabhint{margin:0 0 8px;font-size:.8rem;color:var(--muted);flex:none}
pre{margin:0;font-family:var(--mono);font-size:.76rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow:auto;background:var(--code);color:var(--code-text);border-radius:8px;padding:11px}
#prompt{flex:1;min-height:180px;margin-top:10px}
pre .h{color:var(--accent);font-weight:600}
.checks{list-style:none;margin:0;padding:0;font-size:.88rem;display:grid;gap:6px}
.checks li{display:flex;gap:9px;align-items:baseline;padding:7px 10px;border-radius:7px;background:var(--panel2)}
.checks li::before{content:"○";color:var(--accent)}
.checks li.ok{color:var(--muted);background:transparent}
.checks li.ok::before{content:"●";color:var(--ok)}
.checks li button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.jobs{display:grid;gap:10px}
.job{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.job.sel{border-color:var(--accent)}
.thumb{all:unset;cursor:pointer;position:relative;display:block;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:16/9}
.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.76rem;font-weight:600;padding:3px 8px;border-radius:5px}
.thumb:hover span{background:var(--accent);color:var(--on-accent)}
.job-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pill{font-family:var(--mono);font-size:.7rem;border-radius:5px;padding:2px 7px;background:var(--field);white-space:nowrap}
.pill.run{background:var(--accent);color:var(--on-accent)}.pill.done{background:var(--ok);color:#06231C}.pill.failed{background:var(--warn);color:#2A0B08}
.job dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:.8rem}
.job dt{color:var(--muted)}.job dd{margin:0;font-family:var(--mono);font-size:.76rem}
.job .err{font-size:.82rem;color:var(--warn);margin:0}
.job .actions{margin-top:2px}
.note{font-size:.8rem;color:var(--muted);margin:4px 0}
.alert{border-left:4px solid var(--warn);background:var(--alert-bg);border-radius:7px;padding:8px 10px;margin:8px 0;font-size:.86rem}
.alert.soft{border-left-color:var(--accent);background:var(--soft-bg)}
.alert .btn{margin-top:6px}

/* ---------- timeline ---------- */
.timeline{background:var(--panel);border-top:1px solid var(--line);padding:8px 14px 12px}
.reel-head{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;font-weight:600;margin-bottom:4px;gap:8px;color:var(--muted)}
.reel-head .sum{font-family:var(--mono);color:var(--text)}
.reel-head .sum.bad{color:var(--warn)}
.ruler{position:relative;height:18px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ruler i{position:absolute;bottom:0;width:1px;height:5px;background:var(--line)}
.ruler i.maj{height:9px;background:var(--muted)}
.ruler b{position:absolute;bottom:8px;left:3px;font:400 .66rem var(--mono);color:var(--muted);white-space:nowrap}
.ruler i:last-child b{left:auto;right:3px}
.strip{display:flex;gap:2px;height:52px}
.strip button{border:0;border-radius:5px;min-width:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 8px;overflow:hidden;font-family:var(--mono);font-size:.68rem;line-height:1.25;color:#1E1B3A;background:var(--accent);text-align:left}
.strip button:nth-child(even){background:var(--lilac)}
.strip button:hover{filter:brightness(1.08)}
.strip button b{font-size:.8rem}
.strip button em{font-style:normal;opacity:.75;white-space:nowrap}
.strip .gap{flex:none;border-radius:5px;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 10px);border:1px dashed var(--muted)}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:min(580px,calc(100vw - 24px));width:100%;background:var(--panel);color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,6,16,.7)}
.dlg{padding:18px}
.dlg h2{margin:0 0 4px;font-size:1.25rem;font-weight:800}
.quote{width:100%;border-collapse:collapse;margin:12px 0 4px;font-size:.9rem}
.quote th{text-align:left;font-weight:600;color:var(--muted);padding:5px 10px 5px 0;white-space:nowrap;vertical-align:top}
.quote td{padding:5px 0;font-family:var(--mono);font-size:.84rem}
.quote tr.cost td{font-size:1.3rem;font-weight:600;color:var(--accent)}
.quote tr.cost th{color:var(--text)}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:.88rem}
.check input{width:auto;margin-top:3px;accent-color:var(--accent)}
.dlg .actions{justify-content:flex-end}

.bar{display:none}
@media(max-width:1099px){
  html,body{height:auto}
  body{display:block;padding-bottom:70px}
  .workspace{display:block}
  .panel.left,.panel.right{border:0;border-top:1px solid var(--line)}
  .panel-body{overflow:visible}
  .monitor{padding:12px;container-type:normal}
  .stage{width:100%;max-height:70vh}
  .timeline{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
  .by{display:none}
  .appbar .btn.accent{display:none}
  #prompt{max-height:60vh}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px}
  .bar .btn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
}
@media(max-width:480px){.wm{font-size:1.2rem}.strip button em{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="appbar">
  <div class="logo">
    <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#F4A63A"/><path d="M13 9.5v15l12-7.5z" fill="#1E1B3A"/><path d="M6 12h4M6 17h3M6 22h4" stroke="#1E1B3A" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div class="wm">TRSR <span>Video</span></div>
    <span class="ver" id="ver"></span>
    <span class="by">NorthWindLab Studio</span>
  </div>
  <div class="appbar-right">
    <button type="button" class="btn sm" id="openSettings" data-t="settings" hidden></button>
    <button type="button" class="btn sm" id="theme"></button>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button type="button" class="btn accent" data-gen data-t="gen" hidden></button>
  </div>
</header>

<div class="workspace">
  <section class="panel left">
    <nav class="ptabs" aria-label="Projeto">
      <button type="button" data-panel="story" data-t="s1"></button>
      <button type="button" data-panel="chars" data-t="s2"></button>
      <button type="button" data-panel="place" data-t="s3"></button>
      <button type="button" data-panel="shots" data-t="s4"></button>
      <button type="button" data-panel="look" data-t="s5"></button>
    </nav>
    <div class="panel-body form">

      <section class="step" data-panel-id="story">
        <p class="hint" data-t="s1h"></p>
        <label data-t="title"></label>
        <input data-k="title" data-ph="titlePh">
        <div class="row">
          <div><label data-t="dur"></label><input data-k="dur" type="number" min="1" max="120" step="1"></div>
          <div><label data-t="aspect"></label><select data-k="aspect"><option value="16:9 horizontal">16:9</option><option value="9:16 vertical">9:16</option><option value="1:1 square">1:1</option></select></div>
        </div>
        <div class="row">
          <div><label data-t="genre"></label><select data-k="genre" id="genre"></select></div>
          <div><label data-t="dialogue"></label><select data-k="dialogue" id="dialogue"></select></div>
        </div>
        <label><span data-t="logline"></span> <small data-t="loglineS"></small></label>
        <textarea data-k="logline" rows="6" data-ph="loglinePh"></textarea>
        <label><span data-t="refs"></span> <small data-t="refsS"></small></label>
        <textarea data-k="refs" rows="2" data-ph="refsPh"></textarea>
        <div class="actions">
          <button type="button" class="btn" id="example" data-t="example"></button>
          <button type="button" class="btn" id="reset" data-t="reset"></button>
        </div>
      </section>

      <section class="step" data-panel-id="chars">
        <p class="hint" data-t="s2h"></p>
        <div id="chars"></div>
        <div class="actions"><button type="button" class="btn" id="addChar" data-t="addChar"></button></div>
      </section>

      <section class="step" data-panel-id="place">
        <p class="hint" data-t="s3h"></p>
        <label data-t="location"></label>
        <textarea data-k="location" rows="4" data-ph="locationPh"></textarea>
        <label><span data-t="blocking"></span> <small data-t="blockingS"></small></label>
        <textarea data-k="blocking" rows="3" data-ph="blockingPh"></textarea>
        <label><span data-t="scale"></span> <small data-t="scaleS"></small></label>
        <textarea data-k="scale" rows="3" data-ph="scalePh"></textarea>
        <label><span data-t="continuity"></span> <small data-t="continuityS"></small></label>
        <textarea data-k="continuity" rows="3" data-ph="continuityPh"></textarea>
        <label><span data-t="firstFrame"></span> <small data-t="firstFrameS"></small></label>
        <textarea data-k="firstFrame" rows="4" data-ph="firstFramePh"></textarea>
        <label><span data-t="textLock"></span> <small data-t="textLockS"></small></label>
        <input data-k="textLock" data-ph="textLockPh">
        <label><span data-t="plates"></span> <small data-t="platesS"></small></label>
        <div id="plates"></div>
        <div class="actions"><button type="button" class="btn" id="addPlate" data-t="addPlate"></button></div>
      </section>

      <section class="step" data-panel-id="shots" id="shotsStep">
        <p class="hint" data-t="s4h"></p>
        <div id="shots"></div>
        <div class="actions">
          <button type="button" class="btn" id="addShot" data-t="addShot"></button>
          <button type="button" class="btn" id="even" data-t="even"></button>
        </div>
      </section>

      <section class="step" data-panel-id="look">
        <p class="hint" data-t="s5h"></p>
        <div class="row">
          <div><label data-t="stylePreset"></label><select data-k="stylePreset" id="stylePreset"></select></div>
          <div><label data-t="lightPreset"></label><select data-k="lightPreset" id="lightPreset"></select></div>
        </div>
        <label data-t="style"></label><textarea data-k="style" rows="6"></textarea>
        <label data-t="surface"></label><textarea data-k="surface" rows="3"></textarea>
        <label data-t="lighting"></label><textarea data-k="lighting" rows="5"></textarea>
        <label data-t="grade"></label><textarea data-k="grade" rows="2"></textarea>
        <label data-t="physics"></label><textarea data-k="physics" rows="3"></textarea>
        <label data-t="performance"></label><textarea data-k="performance" rows="3"></textarea>
        <label><span data-t="finalLocks"></span> <small data-t="finalLocksS"></small></label>
        <textarea data-k="finalLocks" rows="2" data-ph="finalLocksPh"></textarea>
      </section>
    </div>
  </section>

  <section class="center">
    <div class="monitor"><div class="stage" id="stage"></div></div>
    <div class="transport">
      <div class="pick" id="pick" hidden></div>
      <button type="button" class="btn accent big" id="gen" data-t="gen" hidden></button>
      <div class="meta" id="stageMeta"></div>
    </div>
  </section>

  <aside class="panel right" id="out">
    <nav class="ptabs" aria-label="Saída">
      <button type="button" data-rtab="library" data-t="libTitle"></button>
      <button type="button" data-rtab="prompt" data-t="outTitle"></button>
      <button type="button" data-rtab="checks"><span data-t="rChecks"></span><span class="score" id="score"></span></button>
    </nav>
    <div class="panel-body">
      <div class="pane" data-rtab-id="library" id="lib">
        <div class="hint" id="libHint"></div>
        <div class="jobs" id="jobs"></div>
      </div>
      <div class="pane col" data-rtab-id="prompt">
        <div class="seg" role="tablist">
          <button type="button" role="tab" data-mode="full" data-t="tabFull"></button>
          <button type="button" role="tab" data-mode="shots" data-t="tabShots"></button>
        </div>
        <p class="tabhint" id="tabhint"></p>
        <div class="actions" style="margin:0;flex:none">
          <button type="button" class="btn sun" id="copy" data-t="copy"></button>
          <button type="button" class="btn" id="dl" data-t="dl"></button>
          <button type="button" class="btn" id="meta" data-t="meta"></button>
        </div>
        <pre id="prompt" tabindex="0"></pre>
      </div>
      <div class="pane" data-rtab-id="checks">
        <p class="hint" data-t="rChecksHint"></p>
        <ul class="checks" id="checks"></ul>
      </div>
    </div>
  </aside>
</div>

<footer class="timeline">
  <div class="reel-head"><span data-t="reel"></span><span class="sum" id="sum"></span></div>
  <div class="ruler" id="ruler" aria-hidden="true"></div>
  <div class="strip" id="strip"></div>
</footer>

<datalist id="lenses">
  <option value="24mm low-angle wide"><option value="28mm wide"><option value="35mm wide establishing">
  <option value="35mm two-shot"><option value="50mm medium"><option value="50mm close-up">
  <option value="85mm close-up"><option value="100mm macro detail"><option value="18mm overhead wide">
</datalist>
<datalist id="moves">
  <option value="LOCKED."><option value="LOCKED. Hold for the reaction."><option value="Slow push-in.">
  <option value="Slow pull-back."><option value="FAST tracking alongside the action."><option value="Whip pan between the characters.">
  <option value="SNAP ZOOM into the face."><option value="Gentle handheld drift."><option value="Slow orbit around the subject.">
  <option value="Crane up to reveal the whole scene.">
</datalist>

<dialog id="genDlg"><div class="dlg" id="genBody"></div></dialog>
<dialog id="setDlg"><div class="dlg" id="setBody"></div></dialog>

<div class="bar">
  <button type="button" class="btn" id="see" data-t="see"></button>
  <button type="button" class="btn" id="copy2" data-t="copy"></button>
  <button type="button" class="btn accent" data-gen data-t="gen" hidden></button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
